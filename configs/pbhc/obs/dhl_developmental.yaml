# @package _global_

obs:
  obs_dict:
    actor_obs:
      - base_ang_vel
      - projected_gravity
      - dof_pos
      - dof_vel
      - actions
      - maturation_stage
      - maturation_mask
      - maturation_range
      - history
    critic_obs:
      - base_lin_vel
      - base_ang_vel
      - projected_gravity
      - dof_pos
      - dof_vel
      - actions
      - maturation_stage
      - maturation_mask
      - maturation_range
      - history
    body_schema_target:
      - body_schema_target
    executed_actions:
      - executed_actions

  obs_auxiliary:
    history:
      base_ang_vel: 4
      projected_gravity: 4
      dof_pos: 4
      dof_vel: 4
      actions: 4

  obs_scales:
    base_lin_vel: 2.0
    base_ang_vel: 0.25
    projected_gravity: 1.0
    dof_pos: 1.0
    dof_vel: 0.05
    actions: 1.0
    maturation_stage: 1.0
    maturation_mask: 1.0
    maturation_range: 1.0
    history: 1.0
    body_schema_target: 1.0
    executed_actions: 1.0

  noise_scales:
    base_lin_vel: 0.0
    base_ang_vel: 0.3
    projected_gravity: 0.2
    dof_pos: 0.01
    dof_vel: 1.0
    actions: 0.0
    maturation_stage: 0.0
    maturation_mask: 0.0
    maturation_range: 0.0
    history: 0.0
    body_schema_target: 0.0
    executed_actions: 0.0

  add_noise_currculum: false
  noise_initial_value: 0.05
  noise_value_max: 1.0
  noise_value_min: 0.00001
  soft_dof_pos_curriculum_degree: 0.00001
  soft_dof_pos_curriculum_level_down_threshold: 40
  soft_dof_pos_curriculum_level_up_threshold: 42

  obs_dims:
    - base_lin_vel: 3
    - base_ang_vel: 3
    - projected_gravity: 3
    - dof_pos: ${robot.dof_obs_size}
    - dof_vel: ${robot.dof_obs_size}
    - actions: ${robot.actions_dim}
    - maturation_stage: 1
    - maturation_mask: ${robot.actions_dim}
    - maturation_range: ${robot.actions_dim}
    - body_schema_target: 52
    - executed_actions: ${robot.actions_dim}

  post_compute_config: {}
  motion_len: -1
